<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9346b" />

    <title>Ñamster Café — Cafetería temática en Providencia, Santiago</title>
    <meta
      name="description"
      content="Café de especialidad, repostería artesanal y hámsters adorables en Avenida Italia 1450, Providencia. Reserva tu mesa, revisa la carta o pide delivery."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Ñamster Café" />
    <meta property="og:title" content="Ñamster Café — Cafetería temática en Providencia" />
    <meta
      property="og:description"
      content="Café de especialidad, repostería artesanal y hámsters adorables en Providencia, Santiago."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dabfglubl/image/upload/f_jpg,q_auto,w_1200,h_630,c_fill,g_auto/v1786693732/edificio_recepcion_l0szat.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Interior del Ñamster Café con su barra y mobiliario en tonos pastel"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <!-- Opens the image CDN in parallel with the HTML, before the hero is discovered. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!--
      LCP preload. The browser cannot discover this image until Vue mounts, and
      `imagesrcset` keeps a phone on the 640px variant (~35 KB) instead of the
      2000px one. The srcset must match HeroSection.vue exactly or the image is
      downloaded twice.
    -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        https://res.cloudinary.com/dabfglubl/image/upload/f_auto,q_auto,w_640,c_limit/v1786693732/edificio_recepcion_l0szat.png   640w,
        https://res.cloudinary.com/dabfglubl/image/upload/f_auto,q_auto,w_1024,c_limit/v1786693732/edificio_recepcion_l0szat.png 1024w,
        https://res.cloudinary.com/dabfglubl/image/upload/f_auto,q_auto,w_1600,c_limit/v1786693732/edificio_recepcion_l0szat.png 1600w,
        https://res.cloudinary.com/dabfglubl/image/upload/f_auto,q_auto,w_2000,c_limit/v1786693732/edificio_recepcion_l0szat.png 2000w"
      imagesizes="100vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Ñamster Café",
        "description": "Cafetería temática con café de especialidad, repostería artesanal y hámsters.",
        "url": "%VITE_SITE_URL%/",
        "image": "https://res.cloudinary.com/dabfglubl/image/upload/f_jpg,q_auto,w_1200/v1786693732/edificio_recepcion_l0szat.png",
        "servesCuisine": ["Café de especialidad", "Repostería"],
        "priceRange": "$$",
        "telephone": "+56229876543",
        "email": "hola@namstercafe.cl",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Avenida Italia 1450",
          "addressLocality": "Providencia",
          "addressRegion": "Región Metropolitana",
          "addressCountry": "CL"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -33.447824,
          "longitude": -70.626977
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "09:00",
            "closes": "21:00"
          }
        ],
        "hasMenu": "%VITE_SITE_URL%/docs/menu.pdf",
        "acceptsReservations": "True"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        Ñamster Café necesita JavaScript para mostrarse. Puedes escribirnos a
        <a href="mailto:hola@namstercafe.cl">hola@namstercafe.cl</a> o llamarnos al
        <a href="tel:+56229876543">+56 2 2987 6543</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
